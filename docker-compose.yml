services:
  postgres:
    profiles: ["infra"]
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    profiles: ["infra"]
    image: redis:7
    ports: ["6379:6379"]

  minio:
    profiles: ["infra"]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports: ["9000:9000", "9001:9001"]

  minio_init:
    profiles: ["infra"]
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; mc mb -p local/${MINIO_BUCKET} || true"

  mock1c:
    profiles: ["infra"]
    build: ./infra/mock-1c
    ports: ["3100:3100"]

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    ports: ["3001:3001"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio_init:
        condition: service_completed_successfully
      mock1c:
        condition: service_started
    volumes:
      - ./:/workspace
    working_dir: /workspace/apps/api
    command: sh -c "npm install && npx prisma generate && npx prisma migrate deploy && npm run dev"

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file: .env
    ports: ["3000:3000"]
    depends_on: [api]
    volumes:
      - ./:/workspace
    working_dir: /workspace/apps/web
    command: sh -c "npm install && npm run dev"
